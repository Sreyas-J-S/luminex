<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a0e2e"/>
      <stop offset="50%" stop-color="#801248"/>
      <stop offset="100%" stop-color="#2a0845"/>
    </linearGradient>
    <radialGradient id="sparkle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ff758c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" rx="36" fill="url(#bgGrad)"/>
  
  <!-- Festive music celebration graphic -->
  <circle cx="200" cy="180" r="140" fill="url(#sparkle)" opacity="0.4"/>
  
  <!-- Stylized musical bottles & sparkles -->
  <g transform="translate(110, 80)">
    <!-- Bottle 1 -->
    <path d="M 60 50 L 70 50 L 72 90 L 85 130 L 85 220 L 45 220 L 45 130 L 58 90 Z" fill="#ff4d6d" transform="rotate(-15, 65, 140)"/>
    <!-- Bottle 2 -->
    <path d="M 120 50 L 130 50 L 132 90 L 145 130 L 145 220 L 105 220 L 105 130 L 118 90 Z" fill="#ff758f" transform="rotate(15, 125, 140)"/>
    <!-- Clinking sparkle -->
    <circle cx="95" cy="120" r="14" fill="#fff"/>
    <path d="M 95 90 L 95 150 M 65 120 L 125 120" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <circle cx="60" cy="80" r="6" fill="#ffd166"/>
    <circle cx="130" cy="80" r="7" fill="#ffd166"/>
    <circle cx="95" cy="60" r="5" fill="#ffd166"/>
  </g>
  
  <!-- Badge Label -->
  <rect x="70" y="270" width="260" height="70" rx="16" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.2)"/>
  <text x="200" y="300" text-anchor="middle" fill="#fff" font-family="-apple-system, Inter, sans-serif" font-size="20" font-weight="800" letter-spacing="1">HINDI POP &amp; HITS</text>
  <text x="200" y="324" text-anchor="middle" fill="#ff758c" font-family="-apple-system, Inter, sans-serif" font-size="13" font-weight="600">LUMINEX MUSIC</text>
</svg>

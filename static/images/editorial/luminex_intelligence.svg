<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" width="500" height="360">
  <defs>
    <linearGradient id="intelligenceGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="25%" stop-color="#7928ca"/>
      <stop offset="50%" stop-color="#0070f3"/>
      <stop offset="75%" stop-color="#00dfd8"/>
      <stop offset="100%" stop-color="#ffd166"/>
    </linearGradient>
    <filter id="glowBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="500" height="360" rx="24" fill="#0d0d12"/>

  <!-- Glowing border around screen -->
  <rect x="50" y="40" width="400" height="280" rx="32" fill="none" stroke="url(#intelligenceGlow)" stroke-width="8" filter="url(#glowBlur)"/>

  <!-- Screen Content Window -->
  <rect x="54" y="44" width="392" height="272" rx="28" fill="#18181f"/>

  <!-- Writing Assistant overlay card -->
  <rect x="90" y="80" width="320" height="180" rx="18" fill="#24242e" stroke="rgba(255,255,255,0.1)"/>
  
  <text x="115" y="115" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#fff">Luminex Intelligence</text>
  <text x="380" y="115" font-family="-apple-system, sans-serif" font-size="12" fill="#00dfd8" text-anchor="end">✨ Proofreading</text>
  
  <rect x="115" y="135" width="270" height="10" rx="5" fill="rgba(255,255,255,0.2)"/>
  <rect x="115" y="155" width="220" height="10" rx="5" fill="rgba(255,255,255,0.2)"/>
  <rect x="115" y="175" width="250" height="10" rx="5" fill="rgba(255,255,255,0.2)"/>
  
  <!-- Suggestion Pill -->
  <rect x="115" y="205" width="120" height="32" rx="16" fill="url(#intelligenceGlow)"/>
  <text x="175" y="226" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">Make Friendly</text>

  <rect x="245" y="205" width="100" height="32" rx="16" fill="#323240"/>
  <text x="295" y="226" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">Summarise</text>
</svg>

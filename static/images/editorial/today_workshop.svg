<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 340" width="440" height="340">
  <defs>
    <linearGradient id="studioWall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8f0"/>
      <stop offset="100%" stop-color="#fae8e0"/>
    </linearGradient>
  </defs>

  <rect width="440" height="340" rx="24" fill="url(#studioWall)"/>

  <!-- Store workshop table & display screen -->
  <rect x="60" y="40" width="320" height="190" rx="14" fill="#2d3748"/>
  <rect x="70" y="50" width="300" height="170" rx="8" fill="#1a202c"/>

  <!-- Large Forum screen showing Rangoli workshop -->
  <g transform="translate(220, 135)">
    <circle cx="0" cy="0" r="55" fill="none" stroke="#f6ad55" stroke-width="3" stroke-dasharray="6,4"/>
    <circle cx="0" cy="0" r="35" fill="none" stroke="#ed64a6" stroke-width="4"/>
    <circle cx="0" cy="0" r="16" fill="#4fd1c5"/>
  </g>
  <text x="85" y="80" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#fbb6ce">TODAY AT LUMINEX</text>

  <!-- Wooden Studio Table in foreground -->
  <path d="M 0 250 L 440 250 L 440 340 L 0 340 Z" fill="#d7b899"/>
  <line x1="0" y1="250" x2="440" y2="250" stroke="#b89370" stroke-width="3"/>

  <!-- Luminex Pad with stylus on table -->
  <rect x="150" y="220" width="140" height="90" rx="10" fill="#2d3748"/>
  <rect x="155" y="224" width="130" height="82" rx="6" fill="#ffffff"/>
  <!-- Doodle on screen -->
  <circle cx="220" cy="265" r="22" fill="#fed7e2"/>
  <circle cx="220" cy="265" r="10" fill="#f687b3"/>
</svg>

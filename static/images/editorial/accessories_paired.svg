<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 380" width="440" height="380">
  <defs>
    <filter id="accShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="440" height="380" fill="#fdfbf9" rx="24"/>

  <!-- Left: Case with Lanyard & Wallet -->
  <g transform="translate(30, 40)" filter="url(#accShadow)">
    <rect x="0" y="0" width="130" height="260" rx="26" fill="#782836"/>
    <!-- Camera Plateau -->
    <rect x="10" y="10" width="65" height="65" rx="16" fill="#581d27"/>
    <circle cx="28" cy="28" r="14" fill="#2d0a11"/>
    <circle cx="28" cy="57" r="14" fill="#2d0a11"/>
    <circle cx="57" cy="42" r="12" fill="#2d0a11"/>
    <!-- Magnetic Wallet attached -->
    <rect x="12" y="95" width="106" height="150" rx="14" fill="#5c1c27" stroke="#48141e" stroke-width="2"/>
    <!-- Lanyard straps -->
    <path d="M 25 260 L 25 330 M 105 260 L 105 330" stroke="#782836" stroke-width="12" stroke-linecap="round"/>
    <circle cx="25" cy="315" r="7" fill="#d2d2d7"/>
    <circle cx="105" cy="315" r="7" fill="#d2d2d7"/>
  </g>

  <!-- Middle: Woven Watch Band -->
  <g transform="translate(190, 40)" filter="url(#accShadow)">
    <rect x="0" y="20" width="45" height="220" rx="6" fill="#d4c5b9"/>
    <!-- Weave texture lines -->
    <line x1="0" y1="40" x2="45" y2="40" stroke="#b8a89b" stroke-width="2"/>
    <line x1="0" y1="70" x2="45" y2="70" stroke="#b8a89b" stroke-width="2"/>
    <line x1="0" y1="100" x2="45" y2="100" stroke="#b8a89b" stroke-width="2"/>
    <line x1="0" y1="130" x2="45" y2="130" stroke="#b8a89b" stroke-width="2"/>
    <line x1="0" y1="160" x2="45" y2="160" stroke="#b8a89b" stroke-width="2"/>
    <line x1="0" y1="190" x2="45" y2="190" stroke="#b8a89b" stroke-width="2"/>
    <line x1="0" y1="220" x2="45" y2="220" stroke="#b8a89b" stroke-width="2"/>
  </g>

  <!-- Right: Sand Duo Case -->
  <g transform="translate(265, 50)" filter="url(#accShadow)">
    <rect x="0" y="0" width="145" height="240" rx="28" fill="#e8ded1"/>
    <!-- Foldable dual camera bump -->
    <rect x="15" y="15" width="115" height="45" rx="22" fill="#d8cdbf"/>
    <circle cx="40" cy="37" r="14" fill="#3a3835"/>
    <circle cx="75" cy="37" r="14" fill="#3a3835"/>
    <!-- Luminex subtle logo mark -->
    <circle cx="72" cy="140" r="12" fill="#d0c4b5"/>
  </g>
</svg>

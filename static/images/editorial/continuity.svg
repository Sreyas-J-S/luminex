<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" width="520" height="360">
  <defs>
    <filter id="ecosystemShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="screenWall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3c72"/>
      <stop offset="50%" stop-color="#2a5298"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
  </defs>

  <rect width="520" height="360" rx="24" fill="#f8f9fa"/>

  <!-- Laptop in background center -->
  <g transform="translate(130, 40)" filter="url(#ecosystemShadow)">
    <rect x="0" y="0" width="260" height="170" rx="14" fill="#d2d2d7" stroke="#999" stroke-width="1.5"/>
    <rect x="10" y="10" width="240" height="150" rx="8" fill="url(#screenWall)"/>
    <!-- Laptop base -->
    <path d="M -25 170 L 285 170 L 270 185 L -10 185 Z" fill="#b0b0b8"/>
    <rect x="105" y="171" width="50" height="4" rx="2" fill="#888"/>
  </g>

  <!-- Tablet on right -->
  <g transform="translate(360, 90)" filter="url(#ecosystemShadow)">
    <rect x="0" y="0" width="130" height="190" rx="18" fill="#1d1d1f"/>
    <rect x="6" y="6" width="118" height="178" rx="14" fill="url(#screenWall)"/>
  </g>

  <!-- Smartphone on left -->
  <g transform="translate(45, 110)" filter="url(#ecosystemShadow)">
    <rect x="0" y="0" width="85" height="170" rx="20" fill="#1d1d1f"/>
    <rect x="4" y="4" width="77" height="162" rx="17" fill="url(#screenWall)"/>
    <!-- Dynamic pill notch -->
    <rect x="28" y="10" width="28" height="8" rx="4" fill="#000"/>
  </g>

  <!-- Watch in bottom left center -->
  <g transform="translate(20, 260)" filter="url(#ecosystemShadow)">
    <rect x="30" y="0" width="46" height="58" rx="14" fill="#2d2d30"/>
    <rect x="34" y="4" width="38" height="50" rx="10" fill="#000"/>
    <text x="53" y="32" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffd166" text-anchor="middle">10:09</text>
  </g>

  <!-- Subtle Handoff Sync Arrow in center -->
  <circle cx="260" cy="275" r="28" fill="#0071e3"/>
  <path d="M 250 275 L 270 275 M 264 269 L 270 275 L 264 281" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

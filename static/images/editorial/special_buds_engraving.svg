<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" width="400" height="360">
  <defs>
    <radialGradient id="caseShade" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f0f0f4"/>
      <stop offset="100%" stop-color="#d8d8de"/>
    </radialGradient>
    <filter id="caseShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>
  
  <!-- Subtle background glow -->
  <circle cx="200" cy="180" r="140" fill="#f5f5f7"/>

  <!-- Buds Case Body -->
  <g filter="url(#caseShadow)">
    <!-- Case Lid seam -->
    <rect x="110" y="70" width="180" height="200" rx="60" fill="url(#caseShade)"/>
    <path d="M 110 135 L 290 135" stroke="#c0c0c6" stroke-width="1.5"/>
    <!-- LED indicator -->
    <circle cx="200" cy="160" r="3.5" fill="#30d158"/>
    
    <!-- Laser Engraved Festive Mandala Smiling Face -->
    <g transform="translate(170, 185) scale(0.65)" stroke="#6e6e73" stroke-width="2.2" fill="none">
      <!-- Petals around -->
      <circle cx="45" cy="45" r="38" stroke-dasharray="4,4"/>
      <!-- Sun petals -->
      <path d="M 45 5 L 45 15 M 45 75 L 45 85 M 5 45 L 15 45 M 75 45 L 85 45 M 17 17 L 24 24 M 66 66 L 73 73 M 17 73 L 24 66 M 66 24 L 73 17" stroke-linecap="round"/>
      <!-- Inner face -->
      <circle cx="45" cy="45" r="24" fill="#f8f8fa"/>
      <!-- Eyes & Smile -->
      <circle cx="37" cy="40" r="3" fill="#6e6e73"/>
      <circle cx="53" cy="40" r="3" fill="#6e6e73"/>
      <path d="M 37 50 Q 45 59 53 50" stroke-linecap="round"/>
    </g>
  </g>
  
  <!-- Festive sparkle accents -->
  <path d="M 320 80 L 324 95 L 339 99 L 324 103 L 320 118 L 316 103 L 301 99 L 316 95 Z" fill="#ff758c"/>
  <path d="M 75 220 L 78 230 L 88 233 L 78 236 L 75 246 L 72 236 L 62 233 L 72 230 Z" fill="#ffb703"/>
</svg>

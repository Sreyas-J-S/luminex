<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%">
  <defs>
    <filter id="pkgShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f7"/>
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec008c"/>
      <stop offset="100%" stop-color="#fc6767"/>
    </linearGradient>
  </defs>

  <!-- Background Ambient Glow -->
  <circle cx="160" cy="120" r="90" fill="#fff0f5" opacity="0.6"/>

  <!-- Package Box -->
  <g filter="url(#pkgShadow)" transform="translate(60, 45)">
    <!-- Main Box -->
    <rect x="0" y="20" width="200" height="130" rx="16" fill="url(#boxGrad)" stroke="#e5e5ea" stroke-width="1.5"/>

    <!-- Decorative Luminex Seal Ribbon -->
    <rect x="85" y="20" width="30" height="130" fill="url(#ribbonGrad)" opacity="0.9"/>
    
    <!-- Central Brand Seal -->
    <circle cx="100" cy="85" r="22" fill="#ffffff" stroke="#fc6767" stroke-width="2"/>
    <circle cx="100" cy="85" r="14" fill="#fc6767" opacity="0.15"/>
    <!-- Luminex Star/Sparkle -->
    <path d="M 100 73 L 103 82 L 112 85 L 103 88 L 100 97 L 97 88 L 88 85 L 97 82 Z" fill="#ec008c"/>

    <!-- Contactless Delivery Badge Icon -->
    <g transform="translate(145, 105)">
      <circle cx="16" cy="16" r="14" fill="#34c759"/>
      <path d="M 11 16 L 14 19 L 21 12" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
